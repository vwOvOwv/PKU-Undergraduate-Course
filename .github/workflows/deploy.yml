name: Deploy File Index
on:
  push:
    branches:
      - main
      - Web
      - ComputerScience
      - LifeScience
  schedule:
    - cron: '0,30 * * * *'  # 每30分钟自动检查更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Config
        uses: actions/checkout@v4

      # 1. 准备目录
      - name: Prepare Directories
        run: |
          mkdir -p docs/computer-science
          mkdir -p docs/life-science

      # 2. 拉取 CS 分支 (路径要和 gen_index.py 里的对应)
      - name: Checkout CS Branch
        uses: actions/checkout@v4
        with:
          ref: ComputerScience
          path: docs/computer-science
          fetch-depth: 1

      # 3. 拉取 LS 分支
      - name: Checkout LS Branch
        uses: actions/checkout@v4
        with:
          ref: LifeScience
          path: docs/life-science
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      # 4. 生成网页
      - name: Generate File Index
        run: |
          # 运行脚本生成 index.html
          python gen_index.py
          
          # 创建 .nojekyll
          touch docs/.nojekyll

      # 5. ⚠️ 关键步骤：暴力清理大文件 ⚠️
      # 在发布之前，把那两个巨大的文件夹直接删掉
      # 这样只留下了 index.html，绝对不会报错
      - name: Cleanup Heavy Files
        run: |
          echo "Deleting heavy folders to prevent upload errors..."
          rm -rf docs/computer-science
          rm -rf docs/life-science
          
          echo "Files remaining to be deployed:"
          ls -R docs/

      # 6. 发布 (现在只剩几KB的网页了，秒传)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true