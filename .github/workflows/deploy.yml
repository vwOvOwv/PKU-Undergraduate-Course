name: Deploy Course Site
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Config
        uses: actions/checkout@v4

      - name: Checkout CS Branch
        uses: actions/checkout@v4
        with:
          ref: ComputerScience
          path: docs/computer-science
          submodules: true
          fetch-depth: 0

      - name: Checkout LS Branch
        uses: actions/checkout@v4
        with:
          ref: LifeScience
          path: docs/life-science
          submodules: true
          fetch-depth: 0

      - name: Create Index
        run: |
          echo "# Welcome to Peiyu's Course Hub" > docs/index.md
          echo "Select a department from the navigation bar above to browse course materials." >> docs/index.md

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: |
          pip install mkdocs-material mkdocs-awesome-pages-plugin
      
      - name: Configure Git Buffer
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

      - name: Build and Deploy
        run: |
          mkdocs gh-deploy --force