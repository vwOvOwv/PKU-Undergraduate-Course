name: Deploy File Index
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Config
        uses: actions/checkout@v4

      # 但我们不会把这些文件上传到 gh-pages，只用它们来生成 index.html
      - name: Checkout CS Branch
        uses: actions/checkout@v4
        with:
          ref: ComputerScience
          path: docs/computer-science
          fetch-depth: 1

      - name: Checkout LS Branch
        uses: actions/checkout@v4
        with:
          ref: LifeScience
          path: docs/life-science
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      # 运行我们刚才写的脚本
      - name: Generate File Index
        run: |
          python gen_index.py

      # === 关键步骤：只发布 index.html ===
      # 我们不需要发布 pdf/ppt，我们只发布这个生成的网页
      # 这样 artifact 大小只有几 KB，绝对不会报错
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          # 排除所有大文件，只上传 html
          exclude_assets: '**/*.pdf,**/*.ppt*,**/*.zip,**/*.mp4,**/*.mov,cs/**,ls/**'